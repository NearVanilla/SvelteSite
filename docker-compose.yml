services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Leaderboards stats export (see scripts/refresh-stats.sh). Required: building without it
      # fails rather than publishing empty or sample leaderboards.
      additional_contexts:
        stats: ${STATS_EXPORT_DIR:?Set STATS_EXPORT_DIR to the stats export folder}
    ports:
      - '80:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
